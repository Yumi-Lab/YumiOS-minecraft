# YumiOS Minecraft — server.properties optimisé pour SmartPi One (1 Go RAM)
# Modifiez ce fichier selon vos besoins puis redémarrez le serveur

# Réseau
server-port=25565
server-ip=
network-compression-threshold=256
max-players=5

# Gameplay
gamemode=survival
difficulty=normal
spawn-protection=0
view-distance=6
simulation-distance=4
max-world-size=10000

# Performance
sync-chunk-writes=false
entity-broadcast-range-percentage=75

# Serveur
motd=YumiOS Minecraft Server
online-mode=true
enable-command-block=false
enable-rcon=false
enable-query=false
enable-jmx-monitoring=false
enable-status=true

# Spawn
allow-nether=true
spawn-monsters=true
spawn-animals=true
spawn-npcs=true
generate-structures=true
level-name=world
level-type=minecraft\:normal
level-seed=
